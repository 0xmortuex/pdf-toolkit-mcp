[project]
name = "pdf-toolkit-mcp"
version = "0.1.0"
description = "MCP server for everyday PDF tasks: info, text, search, tables, merge, split, rotate, images. Pure-Python wheels only: no Java, Ghostscript or system packages."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "0xmortuex" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "pypdf>=5.0",
    "pdfplumber>=0.11",
]
keywords = ["mcp", "pdf", "pypdf", "pdfplumber", "tables", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]

[project.optional-dependencies]
test = ["pytest>=7", "anyio", "reportlab>=4"]

[project.urls]
Homepage = "https://github.com/0xmortuex/pdf-toolkit-mcp"

[project.scripts]
pdf-toolkit-mcp = "pdf_toolkit_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_toolkit_mcp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "reportlab.*"]
ignore_missing_imports = true
follow_untyped_imports = true
